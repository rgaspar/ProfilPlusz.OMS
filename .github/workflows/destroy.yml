name: 05 - Destroy ProfilPlusz.OMS Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment to destroy (dev, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set variables
        run: |
          echo "RESOURCE_GROUP=profilplusz-${{ github.event.inputs.environment }}-rg" >> $GITHUB_ENV

      - name: Destroy resource group
        run: |
          az group delete --name $RESOURCE_GROUP --yes --no-wait

      - name: Output
        run: echo "Resource group $RESOURCE_GROUP deletion initiated."
