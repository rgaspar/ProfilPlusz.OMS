name: BuildAndPushToACR
run-name: 🚀 Deploy v${{ github.ref_name }} - from ${{ github.event.workflow_run.head_branch }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (dev, prod)'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: 'Optional image tag (ha üres, akkor automatikusan generálja)'
        required: false
        default: ''

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image_tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            YEAR=$(date +%Y)
            RUN_NUM=$(printf "%03d" ${{ github.run_number }})
            TAG="v.${YEAR}.${RUN_NUM}"
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "Using IMAGE_TAG=$TAG"

      - name: Azure Container Registry login
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin     

      - name: List files
        run: ls -l ${{ github.workspace }}

      - name: Build Docker image
        run: |
          IMAGE_NAME="${{ secrets.ACR_LOGIN_SERVER }}/profilplusz-oms:${{ env.IMAGE_TAG }}"
          docker build -t $IMAGE_NAME -f ${{ github.workspace }}/Dockerfile ${{ github.workspace }}

      - name: Push Docker image to ACR
        run: |
          IMAGE_NAME="${{ secrets.ACR_LOGIN_SERVER }}/profilplusz-oms:${{ env.IMAGE_TAG }}"
          docker push $IMAGE_NAME     

      - name: GitHub tag létrehozása az IMAGE_TAG alapján
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag $IMAGE_TAG || echo "Tag már létezik, kihagyva."
          git push origin $IMAGE_TAG || echo "Tag push sikertelen vagy már létezik."
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      

      - name: Save image name
        run: |
          echo "${{ secrets.ACR_LOGIN_SERVER }}/profilplusz-oms:${{ env.IMAGE_TAG }}" > image.txt

      - name: Upload image name artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-name
          path: image.txt
