name: Setup Azure Container Registry (ACR)

on:
  workflow_dispatch:
    inputs:
      acr_name:
        description: 'ACR name (e.g., profilpluszomsacr)'
        required: true
      acr_resource_group:
        description: 'Resource group name (e.g., profilplusz-shared-rg)'
        required: true
      acr_location:
        description: 'Azure region (e.g., westeurope)'
        required: true

jobs:
  setup-acr:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create ACR
        run: |
          az acr create --name ${{ github.event.inputs.acr_name }} --resource-group ${{ github.event.inputs.acr_resource_group }} --location ${{ github.event.inputs.acr_location }} --sku Standard --admin-enabled true

      - name: Get ACR credentials
        id: acrcreds
        run: |
          LOGIN_SERVER=$(az acr show --name ${{ github.event.inputs.acr_name }} --query loginServer -o tsv)
          USERNAME=$(az acr credential show --name ${{ github.event.inputs.acr_name }} --query username -o tsv)
          PASSWORD=$(az acr credential show --name ${{ github.event.inputs.acr_name }} --query passwords[0].value -o tsv)
          echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "ACR_USERNAME=$USERNAME" >> $GITHUB_OUTPUT
          echo "ACR_PASSWORD=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Output ACR secrets for GitHub
        run: |
          echo "ACR_LOGIN_SERVER=${{ steps.acrcreds.outputs.ACR_LOGIN_SERVER }}"
          echo "ACR_USERNAME=${{ steps.acrcreds.outputs.ACR_USERNAME }}"
          echo "ACR_PASSWORD=${{ steps.acrcreds.outputs.ACR_PASSWORD }}"
          echo "---"
          echo "Copy these secrets to GitHub repository Settings > Secrets and variables > Actions!"
