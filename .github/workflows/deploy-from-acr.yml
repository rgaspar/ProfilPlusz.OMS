name: Deploy Docker Image from ACR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Select image tag to deploy'
        required: true
        type: choice
        options:
          - 0.1
          - 0.2
          - latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Test AZURE_CREDENTIALS values
        run: |
          echo "$AZURE_CREDENTIALS" | jq 'keys' || echo "Secret not available or not valid JSON"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          auth-type: SERVICE_PRINCIPAL

      - name: Docker Login to ACR
        run: |
          az acr login --name profilpluszomsacr

      - name: Run Docker Container
        run: |
          docker run profilpluszomsacr.azurecr.io/profilplusz:${{ github.event.inputs.image_tag }}
