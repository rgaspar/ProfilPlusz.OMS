name: Deploy Docker Image from ACR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Select image tag to deploy'
        required: true
        type: choice
        options:
          - 0.1
          - 0.2
          - latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login to ACR
        run: |
          az acr login --name profilpluszomsacr

      - name: Run Docker Container
        run: |
          docker run profilpluszomsacr.azurecr.io/profilplusz:${{ github.event.inputs.image_tag }}

