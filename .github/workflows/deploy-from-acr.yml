name: 04 - Deploy to Azure Web App from ACR

on:
  workflow_run:
    workflows: ["02 - Build and Push Docker Image to ACR"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (pl. dev, prod)'
        required: true
        default: 'dev'
        type: string
      image_tag:
        description: 'Image tag to deploy (pl. latest, 0.1, 0.2)'
        required: true
        default: 'latest'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set variables
        run: |
          echo "RESOURCE_GROUP=profilplusz-${{ github.event.inputs.environment }}-rg" >> $GITHUB_ENV
          echo "WEBAPP_NAME=profilplusz-webapp-${{ github.event.inputs.environment }}" >> $GITHUB_ENV

      - name: Set image name
        run: |
          IMAGE_NAME="${{ secrets.ACR_LOGIN_SERVER }}/profilplusz-oms:${{ github.event.inputs.image_tag }}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Update Web App image
        run: |
          az webapp config container set --name $WEBAPP_NAME --resource-group $RESOURCE_GROUP \
            --container-image-name $IMAGE_NAME \
            --container-registry-url https://${{ secrets.ACR_LOGIN_SERVER }} \
            --container-registry-user ${{ secrets.ACR_USERNAME }} \
            --container-registry-password ${{ secrets.ACR_PASSWORD }}

      - name: Output webapp name
        run: |
          echo "Web App Name: $WEBAPP_NAME"
