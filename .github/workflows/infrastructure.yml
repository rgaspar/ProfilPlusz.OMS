name: Create ProfilPlusz.OMS Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (dev, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  provision:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
      url: ${{ steps.deploywebapp.outputs.webapp_url }}
      # Approval is required if you set up the environment in GitHub with required reviewers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set variables
        id: setvars
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=profilplusz-${{ github.event.inputs.environment }}-rg" >> $GITHUB_ENV
          echo "LOCATION=${{ secrets.AZURE_LOCATION }}" >> $GITHUB_ENV
          echo "SQL_SERVER_NAME=profilpluszsql${{ github.event.inputs.environment }}$RANDOM" >> $GITHUB_ENV
          echo "SQL_ADMIN_USER=${{ secrets.SQL_ADMIN_USER }}" >> $GITHUB_ENV
          echo "SQL_ADMIN_PASS=${{ secrets.SQL_ADMIN_PASS }}" >> $GITHUB_ENV
          echo "SQL_DB_NAME=profilplusz${{ github.event.inputs.environment }}db" >> $GITHUB_ENV
          echo "APP_SERVICE_PLAN=profilplusz-${{ github.event.inputs.environment }}-plan" >> $GITHUB_ENV
          echo "WEBAPP_NAME=profilplusz-webapp-${{ github.event.inputs.environment }}-$RANDOM" >> $GITHUB_ENV

      - name: Create resource group
        run: az group create --name $RESOURCE_GROUP --location $LOCATION

      - name: Create SQL Server
        run: az sql server create --name $SQL_SERVER_NAME --resource-group $RESOURCE_GROUP --location $LOCATION --admin-user $SQL_ADMIN_USER --admin-password $SQL_ADMIN_PASS

      - name: Create SQL Database
        run: az sql db create --resource-group $RESOURCE_GROUP --server $SQL_SERVER_NAME --name $SQL_DB_NAME --service-objective Basic

      - name: Allow Azure services to access SQL
        run: az sql server firewall-rule create --resource-group $RESOURCE_GROUP --server $SQL_SERVER_NAME --name AllowAzure --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0

      - name: Create App Service Plan
        run: az appservice plan create --name $APP_SERVICE_PLAN --resource-group $RESOURCE_GROUP --sku F1 --is-linux

      - name: Create Web App
        id: deploywebapp
        run: |
          az webapp create --name $WEBAPP_NAME --resource-group $RESOURCE_GROUP --plan $APP_SERVICE_PLAN --runtime "DOTNET|9.0"
          echo "webapp_url=https://$WEBAPP_NAME.azurewebsites.net" >> $GITHUB_OUTPUT

      - name: Set connection string
        run: |
          az webapp config connection-string set --resource-group $RESOURCE_GROUP --name $WEBAPP_NAME --settings DefaultConnection="Server=tcp:$SQL_SERVER_NAME.database.windows.net,1433;Initial Catalog=$SQL_DB_NAME;Persist Security Info=False;User ID=$SQL_ADMIN_USER;Password=$SQL_ADMIN_PASS;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;" --connection-string-type SQLAzure

      - name: Output webapp name
        run: |
          echo "Web App Name: $WEBAPP_NAME"

  cleanup:
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    needs: provision
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set variables
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=profilplusz-${{ github.event.inputs.environment }}-rg" >> $GITHUB_ENV
      - name: Delete resource group (rollback)
        run: |
          az group delete --name $RESOURCE_GROUP --yes --no-wait
      - name: Output
        run: |
          echo "Rollback: Resource group $RESOURCE_GROUP deletion initiated."
