name: 01 - Infrastructure Provisioning

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (dev, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  provision:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set variables
        id: setvars
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=profilplusz-${{ github.event.inputs.environment }}-rg" >> $GITHUB_ENV
          echo "LOCATION=${{ secrets.AZURE_LOCATION }}" >> $GITHUB_ENV
          echo "SQL_SERVER_NAME=profilpluszsql${{ github.event.inputs.environment }}$RANDOM" >> $GITHUB_ENV
          echo "SQL_ADMIN_USER=${{ secrets.SQL_ADMIN_USER }}" >> $GITHUB_ENV
          echo "SQL_ADMIN_PASS=${{ secrets.SQL_ADMIN_PASS }}" >> $GITHUB_ENV
          echo "SQL_DB_NAME=profilplusz${{ github.event.inputs.environment }}db" >> $GITHUB_ENV
          echo "APP_SERVICE_PLAN=profilplusz-${{ github.event.inputs.environment }}-plan" >> $GITHUB_ENV
          echo "WEBAPP_NAME=profilplusz-webapp-${{ github.event.inputs.environment }}" >> $GITHUB_ENV

      - name: Create resource group
        run: az group create --name $RESOURCE_GROUP --location $LOCATION

      - name: Create SQL Server
        run: |
          az sql server create \
            --name $SQL_SERVER_NAME \
            --resource-group $RESOURCE_GROUP \
            --location $LOCATION \
            --admin-user $SQL_ADMIN_USER \
            --admin-password $SQL_ADMIN_PASS \
            --tags provisioned_by=github_actions environment=$ENVIRONMENT

      - name: Create SQL Database
        run: az sql db create --resource-group $RESOURCE_GROUP --server $SQL_SERVER_NAME --name $SQL_DB_NAME --service-objective Basic

      - name: Allow Azure services to access SQL
        run: az sql server firewall-rule create --resource-group $RESOURCE_GROUP --server $SQL_SERVER_NAME --name AllowAzure --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0

      - name: Create App Service Plan
        run: az appservice plan create --name $APP_SERVICE_PLAN --resource-group $RESOURCE_GROUP --sku B1 --is-linux

      - name: Save SQL server info and upload artifact
        run: |
          mkdir -p artifact
          FQDN=$(az sql server show --resource-group $RESOURCE_GROUP --name $SQL_SERVER_NAME --query fullyQualifiedDomainName -o tsv)
          echo "SQL_SERVER_NAME=$SQL_SERVER_NAME" > artifact/sql-server-info.txt
          echo "SQL_FQDN=$FQDN" >> artifact/sql-server-info.txt
        # upload artifact
      - name: Upload sql-server-info artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-server-info
          path: artifact/sql-server-info.txt

  cleanup:
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    needs: provision
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set variables
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=profilplusz-${{ github.event.inputs.environment }}-rg" >> $GITHUB_ENV
      - name: Delete resource group (rollback)
        run: |
          az group delete --name $RESOURCE_GROUP --yes --no-wait
      - name: Output
        run: |
          echo "Rollback: Resource group $RESOURCE_GROUP deletion initiated."
